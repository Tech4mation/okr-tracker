<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark"><title>Team OKR Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky identity bar, scrollable tab strip, single content column (max 1040px) that stacks cards and tables. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#eaeef4; --line:#d9dfe8; --fg:#13202e; --muted:#5a6a7d;
  --accent:#1f4fd8; --accent-fg:#ffffff; --accent-soft:#e3eafc;
  --good:#17803d; --good-soft:#dff3e5; --warn:#a15c00; --warn-soft:#fdf0d4; --bad:#b4282d; --bad-soft:#fbe3e3;
  --gold:#d9a400; --silver:#8c98a8; --bronze:#b86b32;
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Spline Sans Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1621; --surface:#16212f; --surface2:#1e2b3c; --line:#2a3a4f; --fg:#e7edf5; --muted:#92a3b8;
  --accent:#7d9bff; --accent-fg:#0b1220; --accent-soft:#22305a;
  --good:#5fd08a; --good-soft:#17382a; --warn:#f0b24d; --warn-soft:#3c2f14; --bad:#ff8a8d; --bad-soft:#40201f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1621; --surface:#16212f; --surface2:#1e2b3c; --line:#2a3a4f; --fg:#e7edf5; --muted:#92a3b8;
  --accent:#7d9bff; --accent-fg:#0b1220; --accent-soft:#22305a;
  --good:#5fd08a; --good-soft:#17382a; --warn:#f0b24d; --warn-soft:#3c2f14; --bad:#ff8a8d; --bad-soft:#40201f; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1040px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:16px 0 12px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:2px}
nav.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:600 14px var(--sans);padding:10px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.badge{background:var(--accent);color:var(--accent-fg);border-radius:99px;font:600 11px var(--mono);padding:1px 7px}
main{display:flex;flex-direction:column;gap:20px;padding-top:20px}
h2{font-size:18px;margin:0;letter-spacing:-.01em}
h3{font-size:15px;margin:0}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;min-width:0}
.row.between{justify-content:space-between}
.grow{flex:1 1 200px;min-width:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
input,select,textarea,button{font:inherit;color:var(--fg)}
input[type=text],input[type=email],input[type=search],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
textarea{width:100%;min-height:64px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{opacity:.6;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.medal{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--mono);background:var(--surface2);color:var(--muted)}
.medal.m1{background:var(--gold);color:#241a00}.medal.m2{background:var(--silver);color:#101820}.medal.m3{background:var(--bronze);color:#fff}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
th{font:600 12px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;max-width:90vw}
.sr{position:absolute;left:-9999px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s}}

[hidden]{display:none!important}
html,body{min-height:100%}
.auth{max-width:420px;margin:12vh auto 0}

/* ---- polish: spacing scale 4/8/12/16/24/32, control height 38/32, radius 12/8 ---- */
:root{--r:12px;--r-sm:8px;--ctl:38px;--shadow:0 1px 2px rgba(15,25,40,.05)}
body{line-height:1.5}
h1,h2,h3{text-wrap:balance;margin:0}
header.top{padding:20px 0 16px;gap:12px 24px}
.me{display:flex;align-items:center;gap:10px;min-width:0}
.me .t{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.me .t b{color:var(--fg)}.me .t span{font-size:12px}
.viewas{display:flex;align-items:center;gap:8px;font-size:13px}
nav.tabs{gap:2px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{padding:12px 14px}
main{gap:32px;padding-top:28px}
.pagehead{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between}
.pagehead h1{font-size:21px;line-height:1.2;letter-spacing:-.02em}
.pagehead .sub{margin:4px 0 0;max-width:60ch}
.block{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.sec-h h2{font-size:16px;letter-spacing:-.01em}
.lbl{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.card{border-radius:var(--r);padding:14px 16px;gap:10px;box-shadow:var(--shadow)}
.card h3{font-size:16px;line-height:1.3;letter-spacing:-.01em}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}.cols>.stack{display:contents}.s-attn{order:1}.s-okrs{order:2}.s-prios{order:3}.s-company{order:4}.s-lb{order:5}}
@media(max-width:560px){.stats>:last-child:nth-child(odd){grid-column:1/-1}}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .l{font-size:13px;font-weight:500;color:var(--muted)}
.stat .n{font:600 30px/1.1 var(--mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted);margin-top:auto}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;min-width:48px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good>i{background:var(--good)}
.prog{display:flex;align-items:center;gap:12px}.prog .bar{flex:1}
.pc{font:600 14px var(--mono);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.list{display:flex;flex-direction:column}
.list>*{padding:9px 0;border-top:1px solid var(--line)}
.list>:first-child{border-top:0;padding-top:0}
.list>:last-child{padding-bottom:0}
.kr{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.kr .t{flex:1 1 240px;min-width:0}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.okr-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.person-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.person-h .grow{flex:1 1 120px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 12px var(--mono);flex:none}
.avatar.sm{width:24px;height:24px;font-size:10px}
.lbrow{display:grid;grid-template-columns:28px 32px minmax(0,1.3fr) minmax(0,1fr) 48px;gap:8px 12px;align-items:center}
.lbname .chips{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:4px}
@media(max-width:560px){.lbrow{grid-template-columns:28px 32px minmax(0,1fr) 44px}.lbrow .lbbar{grid-column:1/-1;order:5}}
.medal{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--mono);background:var(--surface2);color:var(--muted)}
.medal.m1{background:var(--gold);color:#241a00}.medal.m2{background:var(--silver);color:#101820}.medal.m3{background:var(--bronze);color:#fff}
.weeknav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.weeknav .lab{font:500 14px var(--mono);padding:0 4px}
.weeknav .btn.sm{min-width:32px}
.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;border-radius:var(--r);padding:12px 16px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);padding:16px 8px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;max-width:44ch}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;line-height:1.5;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.acc{background:var(--accent-soft);color:var(--accent)}
input[type=text],input[type=email],input[type=search],input[type=number],input[type=password],select{height:var(--ctl);border-radius:var(--r-sm);padding:0 12px}
select{padding-right:8px}
select.sm{height:32px;font-size:13px}
textarea{border-radius:var(--r-sm);padding:10px 12px;line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--ctl);padding:0 16px;background:var(--accent);color:var(--accent-fg);border:0;border-radius:var(--r-sm);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.quiet{background:transparent;color:var(--muted);padding:0 10px}
.btn.quiet:hover{background:var(--surface2);color:var(--fg);filter:none}
.btn.bad{background:var(--bad);color:var(--surface)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.foot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.foot .acts{gap:8px}
@media(max-width:560px){.card{padding:16px}main{gap:24px;padding-top:20px}.pagehead h1{font-size:22px}}

/* ---- colour system: indigo brand, with teal, amber, rose, violet and sky as supporting hues ---- */
:root{
  --bg:#f2f4fb; --surface:#ffffff; --surface2:#e9edf7; --line:#dbe0ee;
  --accent:#4f46e5; --accent-fg:#ffffff; --accent-soft:#e7e6fd;
  --ind:#4f46e5; --ind-s:#e7e6fd; --tea:#0f766e; --tea-s:#d5f2ee; --amb:#b45309; --amb-s:#fdeccb;
  --ros:#be123c; --ros-s:#fde2e8; --vio:#6d28d9; --vio-s:#ede4fd; --sky:#0369a1; --sky-s:#d9eefa;
  --hero1:#3730a3; --hero2:#7c3aed; --glow:#dcdafc;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1020; --surface:#161a30; --surface2:#20253f; --line:#2c3256;
  --accent:#8b8dff; --accent-fg:#0b0c24; --accent-soft:#2b2c63;
  --ind:#a5a7ff; --ind-s:#2b2c63; --tea:#5eead4; --tea-s:#12403c; --amb:#fcd34d; --amb-s:#45330d;
  --ros:#fda4af; --ros-s:#4a2030; --vio:#c4b5fd; --vio-s:#38295f; --sky:#7dd3fc; --sky-s:#0f3a4f; --glow:#1d1f4d}}
:root[data-theme="dark"]{
  --bg:#0d1020; --surface:#161a30; --surface2:#20253f; --line:#2c3256;
  --accent:#8b8dff; --accent-fg:#0b0c24; --accent-soft:#2b2c63;
  --ind:#a5a7ff; --ind-s:#2b2c63; --tea:#5eead4; --tea-s:#12403c; --amb:#fcd34d; --amb-s:#45330d;
  --ros:#fda4af; --ros-s:#4a2030; --vio:#c4b5fd; --vio-s:#38295f; --sky:#7dd3fc; --sky-s:#0f3a4f; --glow:#1d1f4d}
body{background:var(--bg) radial-gradient(900px 320px at 85% -100px,var(--glow),transparent) no-repeat}
.logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--hero1),var(--hero2));display:inline-grid;place-items:center;flex:none;position:relative}
.logo::after{content:"";width:12px;height:12px;border-radius:50%;border:3px solid #fff;box-sizing:border-box}
.brandrow{display:flex;align-items:center;gap:12px}.brandrow h1{font-size:22px;letter-spacing:-.02em}
nav.tabs button[aria-current="page"]{color:var(--ind);border-bottom-color:var(--ind)}
nav.tabs button:hover{color:var(--fg)}
.badge{background:var(--ros);color:var(--surface)}
.hero{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;border-radius:14px;padding:16px 20px;color:#fff;background:linear-gradient(120deg,var(--hero1),var(--hero2))}
.hero h1{font-size:26px;letter-spacing:-.02em;line-height:1.2}
.hero p{margin:6px 0 0;opacity:.88;max-width:52ch}
.hero .btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.hero .btn.ghost:hover{background:rgba(255,255,255,.28);filter:none}
.hero .btn:disabled{opacity:.45}
.hero .weeknav .lab{color:#fff}
.stat.ind{background:var(--ind-s)}.stat.ind .n{color:var(--ind)}
.stat.tea{background:var(--tea-s)}.stat.tea .n{color:var(--tea)}
.stat.amb{background:var(--amb-s)}.stat.amb .n{color:var(--amb)}
.stat.ros{background:var(--ros-s)}.stat.ros .n{color:var(--ros)}
.stat.vio{background:var(--vio-s)}.stat.vio .n{color:var(--vio)}
.stat{border-color:transparent;box-shadow:none}
.stat .l{color:var(--fg);opacity:.75}
.stat .s{color:var(--fg);opacity:.65}
.stat .bar{background:rgba(127,127,160,.22)}
.bar>i{background:linear-gradient(90deg,var(--ind),var(--vio))}
.bar.good>i{background:linear-gradient(90deg,var(--tea),#22c55e)}
.bar.warm>i{background:linear-gradient(90deg,#f59e0b,var(--ros))}
.bar.tone>i{background:currentColor}
.stat.ind .bar>i,.stat.vio .bar>i{background:var(--ind)}
.stat.vio .bar>i{background:var(--vio)}
.chip.vio{background:var(--vio-s);color:var(--vio)}.chip.tea{background:var(--tea-s);color:var(--tea)}
.chip.amb{background:var(--amb-s);color:var(--amb)}.chip.sky{background:var(--sky-s);color:var(--sky)}
.chip.acc{background:var(--ind-s);color:var(--ind)}
.avatar.av0{background:var(--ind-s);color:var(--ind)}.avatar.av1{background:var(--tea-s);color:var(--tea)}
.avatar.av2{background:var(--amb-s);color:var(--amb)}.avatar.av3{background:var(--ros-s);color:var(--ros)}
.avatar.av4{background:var(--vio-s);color:var(--vio)}.avatar.av5{background:var(--sky-s);color:var(--sky)}
.lbrow.first{background:linear-gradient(90deg,var(--amb-s),transparent 70%);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:10px}
.picks{display:flex;flex-direction:column;gap:8px}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--fg)}
.pick:hover{border-color:var(--ind)}
.pick .grow{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.auth{max-width:480px}
.weeknav.on-dark .btn:disabled{opacity:.45}
.card{border-color:var(--line)}
.btn.sm.ghost:hover{background:var(--ind-s);color:var(--ind);filter:none}

/* ---- app shell: sidebar + top bar ---- */
:root{--side:#1e1b4b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--side:#090b1c}}
:root[data-theme="dark"]{--side:#090b1c}
body{padding:0}
.wrap{max-width:none;margin:0}
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);color:#c7c9ee;display:flex;flex-direction:column;gap:12px;padding:20px 12px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.side-brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:16px;letter-spacing:-.01em;padding:0 8px 8px}
.side nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-lbl{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:#8a8dc8;padding:14px 12px 6px}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 12px;border:0;background:none;border-radius:10px;color:#c7c9ee;font:500 14px var(--sans);cursor:pointer;text-align:left}
.nav-i svg,.iconbtn svg,.btn svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn svg{width:16px;height:16px}
.nav-i:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-i[aria-current="page"]{background:rgba(255,255,255,.15);color:#fff}
.nav-i .badge{margin-left:auto}
.side-user{border-top:1px solid rgba(255,255,255,.12);padding:16px 8px 0;display:flex;flex-direction:column;gap:12px}
.side-user .me .t b{color:#fff}.side-user .me .t span{color:#a6a9dc;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.side-user .chip{background:rgba(255,255,255,.16);color:#fff}
.side-user .btn.ghost{background:rgba(255,255,255,.1);color:#fff;width:100%}
.side-user .btn.ghost:hover{background:rgba(255,255,255,.18);color:#fff}
.mainwrap{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;min-height:60px;padding:0 32px;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .grow{flex:1}
.crumb{display:flex;align-items:center;gap:8px;font-size:14px}.crumb .sep{color:var(--muted)}
.iconbtn{display:none;place-items:center;width:38px;height:38px;border:0;border-radius:var(--r-sm);background:var(--surface2);color:var(--fg);cursor:pointer}
main.content{width:100%;max-width:1160px;margin:0 auto;padding:18px 32px 0;flex:1}
.foot{width:100%;max-width:1160px;margin:24px auto 0;padding:16px 32px 32px;border-top:0}
.authwrap{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.authwrap .auth{width:100%;margin:0}
.scrim{display:none}
@media(max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;height:100%;z-index:30;transform:translateX(-100%)}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(5,7,25,.55);z-index:25}
  .iconbtn{display:grid}
  .topbar{padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
  main.content{padding:20px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
  .foot{padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}

<body>
<div class="wrap" id="root"><p class="empty">Loading…</p></div>
<div class="toast" id="toast" hidden role="status"></div>
<script>

const ROLES = {ceo:'CEO', hr:'HR', manager:'Manager', member:'Member'};
const SSTAT = ['Not done','In progress','Done'];
const COLS = ['okrs','people','stand','wnotes','logs','welfare','leave','cycles','reviews','roles','cands','ones','fb','docs','surveys','onb','tmpl'];
const S = {signups: []}; COLS.forEach(c => S[c] = []);
const loaded = new Set();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const mondayOf = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - (x.getDay()+6)%7); return x; };
const parseIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const curWeek = () => iso(mondayOf(new Date()));
const today = () => iso(new Date());
const curDay = () => day || today();
const shiftDay = (d, n) => { const x = parseIso(d); x.setDate(x.getDate() + n); return iso(x); };
const dayLabel = d => { const x = parseIso(d); return d === today() ? 'Today' : d === shiftDay(today(), -1) ? 'Yesterday' : x.toLocaleDateString(undefined, {weekday: 'long', day: 'numeric', month: 'short'}); };
const workdaysBack = n => { const out = []; let d = today(); while (out.length < n) { const wd = parseIso(d).getDay(); if (wd !== 0 && wd !== 6) out.push(d); d = shiftDay(d, -1); } return out; };
const fmt = n => String(Math.round(n*10)/10);
const fn = n => Number(n || 0).toLocaleString('en-US', {maximumFractionDigits: 2});
const r0 = n => Math.round(n);

let uid = null, pf = {q: '', team: '', role: ''};
const FF0 = () => ({hist: {q: '', team: '', v: ''}, hire: {q: '', team: ''}, okrst: {q: '', team: ''}, rev: {q: '', team: '', v: ''}, lead: {q: '', team: ''}, perf: {q: '', team: ''}, welf: {q: '', team: ''}, okrs: {q: '', team: '', st: '', mo: ''}, appr: {q: '', team: ''}, stand: {q: '', st: ''}, review: {q: '', st: ''}});
let ff = FF0();
let wk = curWeek(), tab = 'dash', viewAs = null, confirmDel = null;
let draft = {owner:null, obj:'', krs:['',''], ms:[null,null], kt:['binary','binary'], tg:['',''], un:['','']}, showForm = false, navOpen = false;


// ---------- identity & visibility ----------
const realMe = () => S.people.find(x => uid && x.id === uid) || null;
function eff() { const r = realMe(); if (!r) return null; if (viewAs && r.role === 'ceo') { const p = S.people.find(x => x.id === viewAs); if (p) return p; } return r; }
const CFG0 = () => ({
  subs: ['NativeTalk', 'Connect', 'Cyber Villa'],
  leave: [{type: 'Annual leave', days: 25}, {type: 'Sick leave', days: 10}, {type: 'Compassionate leave', days: 5}, {type: 'Unpaid leave', days: 0}],
  yearStart: 0, staleDays: 14, riskAt: 80, behindAt: 60, aheadAt: 110,
  standupWeeks: 2, enpsDays: 28, reviewDueDays: 21, onbWho: ['HR', 'Manager', 'New hire']
});
// Live reference into the config, so every call site stays valid when it is edited in place.
let SUBS = CFG0().subs;
const SUB_TONE = {'NativeTalk': 'sky', 'Connect': 'tea', 'Cyber Villa': 'vio'};
let subFilter = '';
const isGroup = p => p.role === 'ceo' || p.role === 'hr';
const where = p => [p.sub, p.team].filter(Boolean).join(' · ') || 'Group';
const ownerLabel = o => o.owner === 'Company' ? (o.sub ? o.sub : 'Whole company') : o.owner;
const cv = (o, e) => o.owner !== 'Company' || (isGroup(e) ? (!subFilter || !o.sub || o.sub === subFilter) : (!o.sub || o.sub === e.sub));
const mgrOf = p => p && p.mgr ? S.people.find(x => x.id === p.mgr) : null;
const reportsTo = (p, m) => { let c = p, n = 0; while (c && n++ < 20) { if (c.mgr === m.id) return true; c = mgrOf(c); } return false; };
const directs = p => S.people.filter(x => x.mgr === p.id).sort((a, b) => a.name.localeCompare(b.name));
// A team is the unit around someone: a manager's own subtree, or for everyone
// else the subtree of whoever they report to, so peers still see each other.
const unitRoot = p => directs(p).length ? p : (mgrOf(p) || p);
const teamNames = p => { const r = unitRoot(p), s = new Set([p.name, r.name]); S.people.forEach(x => { if (reportsTo(x, r)) s.add(x.name); }); return s; };
// Members see only their own work. Managers see their reports, group-level sees all.
function scope(p) { return isGroup(p) ? new Set([...(subFilter ? [] : [p.name]), ...S.people.filter(x => !subFilter || x.sub === subFilter).map(x => x.name)]) : p.role === 'manager' ? teamNames(p) : new Set([p.name]); }
const lbScope = p => isGroup(p) ? new Set(S.people.filter(x => !subFilter || x.sub === subFilter).map(x => x.name)) : teamNames(p);
const person = n => S.people.find(x => x.name === n);

// ---------- progress ----------
const gain = (n, w) => S.logs.filter(l => l.owner === n && l.week === w).reduce((s,l) => s + l.delta, 0);
// Milestone by default. A target counts up; a level is the latest reading.
const KRTYPE = [['binary', 'Done or not done'], ['count', 'Counts up to a target'], ['level', 'A reading against a target']];
const krMeasured = k => (k.type === 'count' || k.type === 'level') && +k.target > 0;
const krFrac = (k, o, i) => k.pct === 100 ? 1 : krMeasured(k) ? Math.min(1, (o ? krCur(o, k, i) : (+k.cur || 0)) / +k.target) : 0;
const krMeasure = (o, k, i) => `${fn(krCur(o, k, i))} of ${fn(k.target)}${k.unit ? ' ' + k.unit : ''}`;
const okrPct = o => o.krs?.length ? o.krs.reduce((t, k, i) => t + krFrac(k, o, i), 0) / o.krs.length * 100 : 0;
const personOkrs = n => S.okrs.filter(o => o.owner === n);
const personPct = n => { const a = personOkrs(n); return a.length ? a.reduce((s,o) => s + okrPct(o), 0) / a.length : 0; };
const companyPct = e => { const a = S.okrs.filter(o => o.owner === 'Company' && cv(o, e)); return a.length ? a.reduce((s,o) => s + okrPct(o), 0) / a.length : null; };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONFULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const curM = () => new Date().getMonth(), curY = () => new Date().getFullYear();
const isPersonal = o => o.owner !== 'Company';
const overdue = (o, k) => isPersonal(o) && k.month != null && k.pct !== 100 && (o.year < curY() || (o.year === curY() && k.month < curM()));
const monOpts = sel => MONFULL.map((m, i) => `<option value="${i}"${sel === i ? ' selected' : ''}>${m}</option>`).join('');
const dateShort = t => new Date(t).toLocaleDateString(undefined, {day: 'numeric', month: 'short'});
// Industry pattern: the owner says where a goal stands, the system only
// chases staleness. A rating comes out of a review cycle, not a formula.
const OKRST = ['On track', 'At risk', 'Off track'];
const OKRST_TONE = {'On track': 'good', 'At risk': 'warn', 'Off track': 'bad'};

function okrExpected(o) {
  const n = o.krs?.length || 0;
  if (!n || !o.krs.some(k => k.month != null)) return expectedPace();
  const due = o.krs.filter(k => k.month == null || k.month <= curM()).length;
  return due / n * 100;
}
const personExpected = n => { const a = personOkrs(n); return a.length ? a.reduce((t, o) => t + okrExpected(o), 0) / a.length : expectedPace(); };
function autoStatus(o) {
  const exp = okrExpected(o), pct = okrPct(o);
  const ratio = exp ? pct / exp * 100 : 100;
  const late = o.krs.filter(k => overdue(o, k)).length;
  if (ratio + 0.5 < S.cfg.behindAt || late > 1) return 'Off track';
  if (ratio + 0.5 < S.cfg.riskAt || late) return 'At risk';
  return 'On track';
}
const okrStatus = o => autoStatus(o);
// A key result's plan is not just where it sits now: it is every month it was promised for.
const moveLog = (k, to) => (k.month != null && to != null && to !== k.month)
  ? [...(k.moves || []), {from: k.month, to, at: Date.now()}] : (k.moves || []);
const plannedFor = (k, m) => k.month === m || (k.moves || []).some(x => x.from === m);
const movedOutOf = (k, m) => (k.moves || []).some(x => x.from === m) && k.month !== m;
const doneInMonth = (k, m) => k.pct === 100 && k.apAt && new Date(k.apAt).getMonth() === m && new Date(k.apAt).getFullYear() === curY();
// What a month actually came to: delivered, let go, or still owed.
function monthRows(e, m) {
  const out = [];
  S.okrs.filter(o => isPersonal(o) && scope(e).has(o.owner)).forEach(o => o.krs.forEach((k, i) => {
    if (k.month == null) return;
    const planned = plannedFor(k, m), done = doneInMonth(k, m);
    if (!planned && !done) return;
    const outcome = done ? 'delivered' : movedOutOf(k, m) ? 'moved' : (m < curM() ? 'missed' : 'open');
    out.push({o, k, i, outcome});
  }));
  return out;
}
const OUTCOME = {delivered: ['Delivered', 'good'], moved: ['Pushed back', 'warn'], missed: ['Missed', 'bad'], open: ['Still open', '']};
const okrUpdates = o => o.updates || [];
const lastUpd = o => { const u = okrUpdates(o); return u.length ? u[u.length - 1] : null; };
const staleDays = o => { const u = lastUpd(o); return u ? Math.floor((Date.now() - u.at) / 86400000) : null; };
const isStale = o => { const d = staleDays(o); return d === null || d > S.cfg.staleDays; };
// Only a hand-entered number can go stale; an automatic one keeps itself current.
const krStale = (o, k, i) => krMeasured(k) && k.pct !== 100 && !krAuto(o, k, i) && (!k.curAt || Date.now() - k.curAt > S.cfg.staleDays * 86400000);
const staleLabel = o => { const d = staleDays(o); return d === null ? 'never updated' : d === 0 ? 'updated today' : d === 1 ? 'updated yesterday' : 'updated ' + d + ' days ago'; };
const krRef = x => { if (!x.okr) return null; const o = S.okrs.find(y => y.id === x.okr); const k = o && o.krs[x.kr]; return k ? {o, k} : null; };
const krOpts = n => S.okrs.filter(o => o.owner === n).flatMap(o => o.krs.map((k, i) => ({v: o.id + '|' + i, l: k.title, g: o.objective})));
const activityOn = (oid, ki) => S.stand.filter(x => x.okr === oid && x.kr === ki).sort((a, b) => (b.day || b.week).localeCompare(a.day || a.week) || (b.ts || 0) - (a.ts || 0));
// The work logged against a key result: evidence of effort, not a measure of progress.
const actLine = (x, e) => `<div class="kr"><div class="t">${esc(x.text)}<div class="sub">${esc(x.owner)} · ${esc(dayLabel(x.day || x.week))}${x.n != null ? ' · ' + fmt(x.n) + ' ' + esc(x.unit || '') : ''}</div></div>${e && x.owner === e.name ? `<select class="sm" data-chg="stand" data-id="${x.id}" aria-label="Status">${opts(SSTAT, x.status)}</select>` : chip(x.status, statTone(x.status))}</div>`;
const loggedTotal = (oid, ki) => activityOn(oid, ki).filter(x => x.status === 'Done' && x.n != null).reduce((t, x) => t + (+x.n || 0), 0);
const hasLog = (oid, ki) => activityOn(oid, ki).some(x => x.n != null);
const pendingTotal = (oid, ki) => activityOn(oid, ki).filter(x => x.status !== 'Done' && x.n != null).reduce((t, x) => t + (+x.n || 0), 0);
// A counting key result reads itself off the standup log. A reading has nothing to read from,
// so it stays manual. Either can be overridden by its owner.
const krAuto = (o, k, i) => k.type === 'count' && hasLog(o.id, i) && k.curManual == null;
const krCur = (o, k, i) => krAuto(o, k, i) ? loggedTotal(o.id, i) : (k.curManual != null ? +k.curManual : (+k.cur || 0));
const actList = (rows, e) => `<div class="actlog"><div class="list">${rows.map(x => actLine(x, e)).join('')}</div></div>`;
const krState = k => k.pct === 100 ? 'approved' : k.req ? 'awaiting' : 'open';

// ---------- workforce analytics ----------
const WEEK = 7 * 86400000;
const pastWeeks = n => Array.from({length: n}, (_, i) => { const d = parseIso(curWeek()); d.setDate(d.getDate() - 7 * i); return iso(d); });
const goalMonth = () => ((curM() - S.cfg.yearStart + 12) % 12) + 1;
const expectedPace = () => goalMonth() / 12 * 100;
const standupRate = n => { const ws = pastWeeks(4); return ws.filter(w => S.stand.some(x => x.owner === n && x.week === w)).length / ws.length * 100; };
const overdueFor = n => S.okrs.filter(o => o.owner === n).reduce((t, o) => t + o.krs.filter(k => overdue(o, k)).length, 0);
const approvedFor = n => S.okrs.filter(o => o.owner === n).reduce((t, o) => t + o.krs.filter(k => k.pct === 100).length, 0);
const krCount = n => S.okrs.filter(o => o.owner === n).reduce((t, o) => t + o.krs.length, 0);
const lastApproval = n => S.okrs.filter(o => o.owner === n).reduce((t, o) => Math.max(t, ...o.krs.map(k => k.apAt || 0)), 0);
const weeksSinceApproval = n => { const t = lastApproval(n); return t ? Math.floor((Date.now() - t) / WEEK) : 99; };
const STEM = t => String(t).toLowerCase().match(/[a-z]{5,}/g) || [];
function jdCoverage(n) {
  const p = person(n); if (!p || !p.jd) return [];
  const mine = S.okrs.filter(o => o.owner === n);
  return p.jd.map(d => { const words = new Set(STEM(d).map(w => w.replace(/s$/, '')));
    const hit = mine.find(o => [o.objective, ...o.krs.map(k => k.title)].some(t => STEM(t).some(w => words.has(w.replace(/s$/, '')))));
    return {d, okr: hit ? hit.objective : null}; });
}
// What the person said, plus whether they have said it recently. No computed verdict.
const lastRating = n => { const done = S.reviews.filter(r => r.owner === n && r.mgr).map(r => ({r, c: S.cycles.find(c => c.id === r.cycle)}))
    .filter(x => x.c).sort((a, b) => b.r.mgr.at - a.r.mgr.at); return done.length ? {rating: done[0].r.mgr.rating, cycle: done[0].c.name, by: done[0].r.mgr.by} : null; };
function risk(n) {
  const p = person(n); if (!p || isGroup(p)) return null;
  const mine = personOkrs(n), pct = personPct(n), exp = personExpected(n), sr = standupRate(n), od = overdueFor(n);
  const off = mine.filter(o => okrStatus(o) === 'Off track'), atRisk = mine.filter(o => okrStatus(o) === 'At risk');
  const stale = mine.filter(isStale);
  const said = [], chase = [];
  off.forEach(o => said.push(`"${o.objective}" is off track`));
  atRisk.forEach(o => said.push(`"${o.objective}" is at risk`));
  if (!mine.length) chase.push('No OKRs set yet');
  stale.forEach(o => chase.push(`No note on "${o.objective}" since it was ${staleLabel(o)}`));
  if (sr / 25 < S.cfg.standupWeeks) chase.push(`Logged a standup in ${r0(sr / 25)} of the last 4 weeks`);
  if (od) chase.push(plural(od, 'key result is', 'key results are') + ' past their due month');
  // Where a goal is measured, check what the number says against what its owner said.
  const numStale = mine.reduce((t, o) => t + o.krs.filter((k, i) => krStale(o, k, i)).length, 0);
  if (numStale) chase.push(plural(numStale, 'measured key result has', 'measured key results have') + ' not moved in over ' + S.cfg.staleDays + ' days');
  mine.forEach(o => o.krs.forEach((k, i) => { if (k.type !== 'count' || k.pct === 100 || k.curManual == null) return;
    const lt = loggedTotal(o.id, i);
    if (lt > +k.curManual) chase.push(`Standup log adds up to ${fn(lt)} on "${k.title}" but the number was set by hand to ${fn(+k.curManual)}`);
  }));
  const band = off.length ? 'off' : atRisk.length ? 'risk' : (chase.length ? 'watch' : 'ok');
  return {n, p, pct, exp, sr, od, said, chase, flags: [...said, ...chase], stale: stale.length, numStale, noOkrs: !mine.length,
    rating: lastRating(n), ix: exp ? pct / exp * 100 : 0, band};
}
const perfIndex = n => { const exp = expectedPace(); return exp ? personPct(n) / exp * 100 : 0; };
const isAhead = r => r.ix >= S.cfg.aheadAt || (r.pct >= 100 && goalMonth() < 12);
const BAND = {ok: ['On track', 'good'], watch: ['Needs a nudge', 'acc'], risk: ['At risk', 'warn'], off: ['Off track', 'bad']};

    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }

    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }

  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

    if (S.people.some(p => p.name.toLowerCase() === name.toLowerCase()) || added.some(p => p.name.toLowerCase() === name.toLowerCase())) return skipped.push(`Row ${i + 2}: ${name} is already in the directory`);
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return skipped.push(`Row ${i + 2}: ${email} is not a valid email`);
    if (email && S.people.some(p => (p.email || '').toLowerCase() === email.toLowerCase())) return skipped.push(`Row ${i + 2}: ${email} is already in use`);
    const sub = SUBS.find(x => x.toLowerCase() === get('sub').toLowerCase()) || '';
    if (get('sub') && !sub) return skipped.push(`Row ${i + 2}: "${get('sub')}" is not one of ${SUBS.join(', ')}`);
    added.push({id: uuid(), name, email, sub, role: roleOf(get('role')), team: get('team'), title: get('title'),
      mgrName: get('mgr'), mgr: null, joined: today(), jd: [], contract: 'Permanent', notice: '1 month', uid: null});
  });
  added.forEach(p => S.people.push(p));
  // Resolve reporting lines last, so a manager listed in the same file still links up.
  added.forEach(p => { const m = p.mgrName && S.people.find(x => x.id !== p.id && x.name.toLowerCase() === p.mgrName.toLowerCase());
    p.mgr = m ? m.id : null; delete p.mgrName; });
  if (added.length) commit();
  return {added: added.length, skipped, error: ''};
}

          <div class="acts"><select class="sm" data-chg="stand" data-id="${x.id}" aria-label="Status"${own ? '' : ' disabled'} title="${own ? 'Set your status' : esc(x.owner) + ' sets this'}">${opts(SSTAT, x.status)}</select>
          ${can ? `<button class="btn quiet sm" data-act="delstand" data-id="${x.id}" aria-label="Delete activity">Delete</button>` : ''}</div></div>`; }).join('')}</div></div>`).join('')}</section>`; }).join('')
    : `<div class="card">${empty(weekItems.length ? 'No activities match these filters.' : who === 'mine' ? 'You have not logged anything this week.' : 'Nobody else has logged anything this week.')}</div>`}`;
}

function viewReview(e) {
  const sc = scope(e);
  const fri = fridayDue(e);
  const noteId = n => wk + '_' + (person(n)?.id || 'owner');
  const notes = new Map(S.wnotes.filter(x => x.week === wk).map(x => [x.owner, x]));
  const names = [...new Set([...S.stand.filter(x => x.week === wk && sc.has(x.owner)).map(x => x.owner), ...notes.keys(), e.name])].filter(n => sc.has(n)).sort((a, b) => a.localeCompare(b));
  const rf = ff.review;
  const hasTeam = names.some(n => n !== e.name);
  const rWho = !hasTeam ? 'mine' : revWho || 'mine';
  const scoped = names.filter(n => rWho === 'mine' ? n === e.name : n !== e.name);
  const shownNames = scoped.filter(n => hit(rf.q, n) && (!rf.st || (rf.st === 'with') === !!notes.get(n)?.text));
  const rTabs = hasTeam ? `<div class="seg" role="tablist" aria-label="Whose review">${[['mine', 'Mine', names.filter(n => n === e.name).length], ['team', isGroup(e) ? 'Everyone' : 'My team', names.filter(n => n !== e.name).length]].map(([v, l, c]) =>
    `<button role="tab" aria-selected="${rWho === v}" data-act="revwho" data-v="${v}">${l}<span class="seg-n">${c}</span></button>`).join('')}</div>` : '';
  return `${pageHead('Friday Review', 'Look back on the week: what your standup covered, plus blockers, achievements and feedback.', weekNav())}
  ${fri ? '<div class="banner"><span>It is Friday. Add your comments on blockers, achievements and feedback.</span></div>' : ''}
  ${rTabs}
  ${scoped.length > 1 ? fbar('review', {ph: 'Search by name', st: [['with', 'Comments added'], ['without', 'No comments yet']], stLabel: 'Comments', count: `Showing ${shownNames.length} of ${scoped.length} people`}) : ''}
  ${shownNames.length ? shownNames.map(o => {
    const act = S.stand.filter(x => x.week === wk && x.owner === o).sort((a, b) => (a.ts || 0) - (b.ts || 0));
    const d = act.filter(x => x.status === 'Done').length;
    const nt = notes.get(o), canN = o === e.name;
    return `<section class="card"><div class="person-h">${avatar(o)}<b class="grow">${esc(o)}</b>${act.length ? chip(d + ' of ' + act.length + ' done', d === act.length ? 'good' : 'acc') : ''}${nt && nt.text ? chip('Comments added', 'tea') : chip('No comments yet')}</div>
      <div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Standup this week</span>
        ${act.length ? `<div class="list">${act.map(x => `<div class="kr"><div class="t">${esc(x.text)}${x.day ? `<div class="sub">${esc(dayLabel(x.day))}</div>` : ''}</div>${chip(x.status, statTone(x.status))}</div>`).join('')}</div>` : '<span class="sub">No standup entries.</span>'}</div>
      <div style="display:flex;flex-direction:column;gap:8px"><label class="lbl" for="wn-${noteId(o)}">Blockers, achievements or feedback</label>
        ${canN ? `<textarea id="wn-${noteId(o)}" placeholder="Anything blocking you, wins from the week, or feedback. Include work outside your key results.">${esc(nt?.text || '')}</textarea><div class="end" style="display:flex;justify-content:flex-end"><button class="btn sm" data-act="savenote" data-o="${esc(o)}">Save comments</button></div>`
          : `<div${nt && nt.text ? '' : ' class="sub"'}>${nt && nt.text ? esc(nt.text) : 'No comments yet.'}</div>`}</div></section>`;
  }).join('') : `<div class="card">${empty(scoped.length ? 'No one matches these filters.' : rWho === 'mine' ? 'Nothing of yours to review this week.' : 'Nothing from anyone else this week.')}</div>`}`;
}

const canSeeDossier = (e, p) => !!p && (isGroup(e) || (e.role === 'manager' && teamNames(e).has(p.name)) || p.name === e.name);
const dosLink = (e, p, label) => canSeeDossier(e, p) ? `<button class="namelink" data-act="dossier" data-id="${p.id}">${esc(label || p.name)}</button>` : esc(label || p.name);

  ${openRole === 'new' && isGroup(e) ? `<form class="card" data-submit="addrole"><h2 style="font-size:16px">New role</h2>

  ${hireTab === 'tmpl' && isGroup(e) ? `

    ${tdraft ? `<form class="card" data-submit="savetmpl"><div class="sec-h"><h2 style="font-size:16px">${esc(tdraft.id ? 'Edit checklist' : 'New checklist')}</h2>${tdraft.id && tdraft.sub ? chip(tdraft.sub, SUB_TONE[tdraft.sub] || '') : ''}</div>
      <div class="row"><label class="f grow" style="flex-basis:220px">Name<input type="text" id="tn" value="${esc(tdraft.name)}" placeholder="e.g. Connect starter"></label>

      <div style="display:flex;flex-direction:column;gap:6px"><span class="lbl">Tasks</span>
        ${tdraft.tasks.map((t, i) => `<div class="row" style="flex-wrap:nowrap">
          <input type="text" class="grow" id="tt-${i}" value="${esc(t.t)}" placeholder="What needs doing" aria-label="Task ${i + 1}">
          <select id="to-${i}" aria-label="Who does it">${S.cfg.onbWho.map(x => `<option${t.who === x ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select>
          <label class="f" style="flex:none"><input type="number" id="td-${i}" value="${t.off}" aria-label="Days from start" style="width:84px"></label>
          <button type="button" class="btn quiet sm" data-act="rmtask" data-i="${i}" aria-label="Remove task ${i + 1}">Remove</button></div>`).join('')}
        <div class="row"><button type="button" class="btn ghost sm" data-act="addtask">+ Add task</button><span class="sub">Days are counted from the start date. Use a negative number for before day one.</span></div></div>
      <div class="row"><button class="btn" type="submit">Save checklist</button><button type="button" class="btn quiet" data-act="canceltmpl">Cancel</button>
        ${tdraft.id && tdraft.sub ? `<button type="button" class="btn quiet" data-act="deltmpl" data-id="${tdraft.id}">Delete</button>` : ''}</div></form>`
      : `<div class="row"><button class="btn" data-act="newtmpl">+ New checklist</button></div>`}
    ${S.tmpl.map(tp => `<section class="card"><div class="sec-h"><h2>${esc(tp.name)}</h2><div class="person-h">${tp.sub ? chip(tp.sub, SUB_TONE[tp.sub] || '') : chip('Default')}${chip(plural(tp.tasks.length, 'task', 'tasks'))}<button class="btn quiet sm" data-act="edittmpl" data-id="${tp.id}">Edit</button></div></div>
      <div class="list">${[...tp.tasks].sort((a, b) => a.off - b.off).map(t => `<div class="kr"><div class="t">${esc(t.t)}<div class="sub">${esc(t.who)} · ${t.off < 0 ? Math.abs(t.off) + ' days before start' : t.off === 0 ? 'on day one' : 'day ' + t.off}</div></div></div>`).join('')}</div></section>`).join('')}
  ` : hireTab === 'onb' ? (mineOnb.length ? mineOnb.map(o => { const p = person(o.owner), late = o.tasks.filter(t => onbLate(o, t)).length;
    return `<section class="card"><div class="person-h">${avatar(o.owner)}<div class="grow" style="min-width:0"><div><b>${dosLink(e, p)}</b> ${chip(r0(onbPct(o)) + '% done', onbPct(o) >= 100 ? 'good' : '')}${late ? chip(plural(late, 'task overdue', 'tasks overdue'), 'bad') : ''}</div>
      <div class="sub">${esc(p?.title || '')}${p?.sub ? ' · ' + esc(where(p)) : ''} · started ${esc(new Date(o.start).toLocaleDateString(undefined, {day: 'numeric', month: 'long'}))}${o.from ? ' · ' + esc(o.from) : ''}</div></div></div>
    ${bar(onbPct(o))}
    <div class="list">${o.tasks.map((t, i) => ({t, i})).sort((a, b) => a.t.off - b.t.off).map(({t, i}) => `<div class="kr"><div class="t">${t.done ? `<s>${esc(t.t)}</s>` : esc(t.t)}
      <div class="sub">${esc(t.who)} · due ${esc(onbDue(o, t).toLocaleDateString(undefined, {day: 'numeric', month: 'short'}))}${t.done ? ' · done by ' + esc(t.by) : onbLate(o, t) ? ' · overdue' : ''}</div></div>
      <div class="acts">${t.done ? chip('Done', 'good') : onbLate(o, t) ? chip('Overdue', 'bad') : chip('To do')}
        ${onbCanTick(e, o, t) ? `<button class="btn ${t.done ? 'quiet' : 'ghost'} sm" data-act="onbtick" data-n="${esc(o.owner)}" data-i="${i}">${t.done ? 'Undo' : 'Mark done'}</button>` : ''}</div></div>`).join('')}</div></section>`; }).join('')
    : `<div class="card">${empty('Nobody is onboarding right now.' + (isGroup(e) ? ' Hiring a candidate starts a checklist automatically.' : ''))}</div>`) : `
  ${all.length > 1 ? fbar('hire', {ph: 'Search roles or candidates', team: [...new Set(all.map(r => r.team))].sort(), count: `Showing ${rs.length} of ${all.length} roles`}) : ''}
  ${rs.length ? rs.map(r => { const cs = candsFor(r).sort((a, b) => STAGES.indexOf(a.stage) - STAGES.indexOf(b.stage) || a.name.localeCompare(b.name));

    <p class="sub" style="margin:-4px 0 4px">${esc(r.team)} · ${esc(r.sub)} · hiring manager ${esc(r.hm)} · open since ${esc(new Date(r.opened).toLocaleDateString(undefined, {day: 'numeric', month: 'short'}))}</p>
    ${r.jd && r.jd.length ? `<p class="sub" style="margin:0">Responsibilities: ${esc(r.jd.join(' · '))}</p>` : ''}
    ${can && r.status === 'Open' ? `<form class="row" data-submit="addcand" style="align-items:flex-end"><input type="hidden" id="cd-role" value="${r.id}">
      <label class="f grow" style="flex-basis:220px">Add a candidate<input type="text" id="cd-name-${r.id}" placeholder="Full name"></label><button class="btn" type="submit" data-r="${r.id}">Add</button></form>` : ''}
    <div class="list">${cs.length ? cs.map(c => `<div class="kr"><div class="person-h t">${avatar(c.name)}<div style="min-width:0"><div><b>${esc(c.name)}</b></div><div class="sub">${esc(c.email)} · added ${esc(dateShort(c.at))}</div></div></div>
      <div class="acts">${can ? `<select class="sm" data-chg="stage" data-id="${c.id}" aria-label="Stage for ${esc(c.name)}">${STAGES.map(st => `<option${c.stage === st ? ' selected' : ''}>${esc(st)}</option>`).join('')}</select>` : chip(c.stage, STONE[c.stage])}
      ${c.stage === 'Hired' && can && !person(c.name) ? `<button class="btn sm" data-act="hirecand" data-id="${c.id}">Add to directory</button>` : ''}
      ${c.stage === 'Hired' && person(c.name) ? chip('In the directory', 'good') : ''}</div></div>`).join('') : '<div class="sub">No candidates yet.</div>'}</div></section>`; }).join('')
    : `<div class="card">${empty(all.length ? 'No roles match these filters.' : 'No roles open.')}</div>`}`}`;

function viewRev(e) {
  const c = liveCycle(), f = ff.rev, q = f.q.trim().toLowerCase();
  if (!c) return `<div class="card">${empty('No review cycle is open.', isGroup(e) ? '<button class="btn" data-act="opencycle">Open a cycle</button>' : '')}</div>`;
  const mine = revOf(c.id, e.name), days = revDue(c);
  const team = [...lbScope(e)].map(n => person(n)).filter(p => p && !isGroup(p) && p.name !== e.name && (isGroup(e) || reportsTo(p, e)))
    .map(p => ({p, r: revOf(c.id, p.name)})).filter(x => (!f.team || x.p.team === f.team) && (!f.v || revStage(x.r) === f.v) && (!q || x.p.name.toLowerCase().includes(q)))
    .sort((a, b) => a.p.name.localeCompare(b.p.name));
  const allMine = [...lbScope(e)].map(n => person(n)).filter(p => p && !isGroup(p) && p.name !== e.name && (isGroup(e) || reportsTo(p, e)));
  const doneN = allMine.filter(p => revStage(revOf(c.id, p.name)) === 'done').length;
  const scale = (id, sel) => `<label class="f">Rating<select id="${id}">${RATINGS.map((l, i) => i ? `<option value="${i}"${sel === i ? ' selected' : ''}>${i} · ${l}</option>` : '').join('')}</select></label>`;
  const open = openRev;
  const selfCard = `<section class="card"><div class="sec-h"><h2>Your self-review</h2>${chip(REVST[revStage(mine)][0], REVST[revStage(mine)][1])}</div>
    ${mine && mine.self ? `<div class="list"><div class="kr"><div class="t">${esc(mine.self.text)}<div class="sub">You rated yourself ${mine.self.rating} · ${esc(RATINGS[mine.self.rating])} · sent ${esc(dateShort(mine.self.at))}</div></div></div>
      ${mine.mgr ? `<div class="kr"><div class="t">${esc(mine.mgr.text)}<div class="sub">${esc(mine.mgr.by)} rated you ${mine.mgr.rating} · ${esc(RATINGS[mine.mgr.rating])} · ${esc(dateShort(mine.mgr.at))}</div></div>${chip('Complete', 'good')}</div>`
        : `<div class="sub">Waiting on ${esc(approverOf({owner: e.name}))}.</div>`}</div>`
      : `<form data-submit="saveself" style="display:flex;flex-direction:column;gap:12px">
      <label class="f">How did the half go?<textarea id="rv-self" placeholder="What you delivered, what slipped and why, what you need next half."></textarea></label>
      <div class="row">${scale('rv-selfr', 3)}<button class="btn" type="submit">Send self-review</button></div></form>`}</section>`;
  return `<div class="row between"><p class="sub" style="margin:0">${esc(c.name)}. Everyone writes a self-review, then their manager responds.</p><div class="row">${isGroup(e) ? `<button class="btn quiet sm" data-act="closecycle">Close cycle</button>` : ''}${expBtn('rev')}</div></div>
  <div class="banner${days < 7 ? '' : ' info'}"><span>${days > 0 ? `${plural(days, 'day', 'days')} until self-reviews are due on ${esc(new Date(c.due).toLocaleDateString(undefined, {day: 'numeric', month: 'long'}))}.` : 'Self-reviews were due on ' + esc(new Date(c.due).toLocaleDateString(undefined, {day: 'numeric', month: 'long'})) + '.'}</span></div>
  ${selfCard}
  ${allMine.length ? `<section class="card"><div class="sec-h"><h2>${isGroup(e) ? 'Everyone' : 'Your team'}</h2><span class="sub">${doneN} of ${allMine.length} complete</span></div>
    ${allMine.length > 1 ? fbar('rev', {ph: 'Search by name', team: teamsIn(allMine.map(p => p.name)), v: [['none', 'Not started'], ['self', 'Self-review in'], ['done', 'Complete']], vLabel: 'Stage', vAll: 'Any stage', count: `Showing ${team.length} of ${allMine.length}`}) : ''}
    <div class="list">${team.length ? team.map(({p, r}) => { const st = revStage(r), ed = open === p.name;
      return `<div class="krb"><div class="kr"><div class="person-h t">${avatar(p.name)}<div style="min-width:0"><div><b>${dosLink(e, p)}</b></div>
        <div class="sub">${esc(p.title || ROLES[p.role])}${r && r.self ? ' · rated themselves ' + r.self.rating : ''}${r && r.mgr ? ' · you rated ' + r.mgr.rating : ''}</div>
        ${r && r.self ? `<div>${esc(r.self.text)}</div>` : ''}${r && r.mgr ? `<div class="sub">${esc(r.mgr.by)}: ${esc(r.mgr.text)}</div>` : ''}</div></div>
        <div class="acts">${chip(REVST[st][0], REVST[st][1])}${st === 'self' && reportsTo(p, e) && !ed ? `<button class="btn sm" data-act="openrev" data-n="${esc(p.name)}">Write review</button>` : ''}</div></div>
        ${ed ? `<form class="ci-form" data-submit="savemgr" style="flex-wrap:wrap"><input type="hidden"><label class="f grow" style="flex-basis:100%">Your review of ${esc(p.name)}<textarea id="rv-mgr" placeholder="What they delivered, where they need support, what happens next."></textarea></label>
          <div class="row">${scale('rv-mgrr', r && r.self ? r.self.rating : 3)}<button class="btn" type="submit">Submit review</button><button type="button" class="btn quiet" data-act="cancelrev">Cancel</button></div></form>` : ''}</div>`; }).join('')
      : empty('Nobody matches these filters.')}</div></section>` : ''}`;
}

function viewPerf(e) {
  const f = ff.perf, q = f.q.trim().toLowerCase();
  const all = [...lbScope(e)].map(n => risk(n)).filter(Boolean);
  const counts = {off: all.filter(r => r.band === 'off').length, risk: all.filter(r => r.band === 'risk').length, watch: all.filter(r => r.band === 'watch').length, ok: all.filter(r => r.band === 'ok').length};
  const noOkrs = all.filter(r => r.noOkrs), staleN = all.filter(r => r.stale).length;
  const top = [...all].sort((a, b) => b.ix - a.ix).slice(0, 5).map(r => r.n);
  const rows = all.filter(r => (perfTab === 'all' || (perfTab === 'top' ? top.includes(r.n) : r.band === perfTab)) && (!f.team || r.p.team === f.team) && (!q || r.n.toLowerCase().includes(q) || (r.p.title || '').toLowerCase().includes(q)))
    .sort((a, b) => perfTab === 'top' ? (b.ix - a.ix) || (b.pct - a.pct) : ({off: 0, risk: 1, watch: 2, ok: 3})[a.band] - ({off: 0, risk: 1, watch: 2, ok: 3})[b.band] || a.pct - b.pct);
  const segs = [['all', 'Everyone', all.length], ['off', 'Off track', counts.off], ['risk', 'At risk', counts.risk], ['watch', 'Needs a nudge', counts.watch], ['top', 'Top five', Math.min(5, all.length)]];
  return `${pageHead('Performance signals', 'Where each person stands, worked out from their numbers, and what needs chasing. Only managers, HR and the CEO see this. Ratings come from the review cycle, not from this page.', expBtn('perf'))}
  <div class="stats">
    ${stat('ros', 'Behind or at risk', counts.off + counts.risk, counts.off + counts.risk ? 'Worked out from progress against the expected pace' : 'Nobody is behind', null, 'perf')}
    ${stat('amb', 'No word from the owner', staleN, `Goals with no note in over ${S.cfg.staleDays} days`, null, 'perf')}
    ${stat('tea', 'On track', counts.ok, 'Current and no flags raised', null, 'perf')}
    ${stat('vio', 'Ahead of plan', all.filter(isAhead).length, `Past the ${r0(expectedPace())}% expected by month ${goalMonth()} of 12, or already finished`, null, 'perf')}</div>
  ${noOkrs.length ? `<div class="banner"><span>${plural(noOkrs.length, 'person has', 'people have')} no OKRs set: ${esc(noOkrs.map(r => r.n).join(', '))}. That is their manager's to fix, not a performance flag.</span></div>` : ''}
  <div class="seg" role="tablist" aria-label="Performance band">${segs.map(([v, l, c]) => `<button role="tab" aria-selected="${perfTab === v}" data-act="perftab" data-v="${v}">${l}<span class="seg-n">${c}</span></button>`).join('')}</div>
  ${all.length > 1 ? fbar('perf', {ph: 'Search by name or job title', team: teamsIn(all.map(r => r.n)), count: `Showing ${rows.length} of ${all.length}`}) : ''}

function viewWelf(e) {

    ${!sv ? `<p class="sub" style="margin:0">Nobody has been asked for a check-in this week.</p>
      <div class="row"><button class="btn" data-act="sendsurvey">Send to ${plural(recipients().length, 'person', 'people')}</button><span class="sub">Nothing is emailed in this demo. It puts the check-in on their dashboard.</span></div>`
      : `<p class="sub" style="margin:0">Sent by ${esc(sv.sentBy)} on ${esc(dateShort(sv.sentAt))} to ${plural(recipients().length, 'person', 'people')}.${sv.remindedAt ? ' Reminder sent ' + esc(dateShort(sv.remindedAt)) + '.' : ''}</p>
      <div class="prog">${bar(gotIt.length / recipients().length * 100)}<span class="pc">${r0(gotIt.length / recipients().length * 100)}%</span></div>
      <p class="sub" style="margin:0">${gotIt.length} of ${recipients().length} have replied.${miss.length ? ' Waiting on ' + esc(miss.map(p => p.name).join(', ')) + '.' : ' Everyone has replied.'}</p>
      <div class="row">${miss.length && !sv.closed ? `<button class="btn ghost sm" data-act="remindsurvey">Send a reminder</button>` : ''}

  return `<div class="row between"><p class="sub" style="margin:0">A weekly check-in on workload and wellbeing. Managers and HR see their own people.</p><div class="row">${weekNav()}${expBtn('welf')}</div></div>
  ${svCard}
  ${(!sv || sv.closed) ? `<div class="card">${empty(sv ? 'This week\'s check-in is closed.' : 'No check-in has been sent for this week yet.')}</div>` : ''}
  ${own ? `<form class="card" data-submit="savewelf"><div class="sec-h"><h2 style="font-size:16px">${mine ? 'Your check-in this week' : 'How is this week going?'}</h2>${mine ? chip('Sent ' + dateShort(mine.ts), 'good') : ''}</div>
    <p class="sub" style="margin:0">Two questions, once a week. ${esc(approverOf({owner: e.name}))} and HR can read your answers.</p>
    <div class="row" style="align-items:flex-end">${scale('wf-load', 'How heavy was your workload?', WLOAD, mine?.workload || 3)}${scale('wf-mood', 'How are you doing?', MOOD, mine?.mood || 4)}</div>
    <label class="f"><span>Anything you want to flag? <span class="sub">(optional)</span></span><input type="text" id="wf-note" value="${esc(mine?.note || '')}" placeholder="Blockers, workload, anything you need"></label>
    ${!enpsAsked(e.name) || mine?.enps != null ? `<div class="askonce"><label class="f" for="wf-enps">How likely are you to recommend working here, to someone looking for a job?</label>
      <div class="row"><span class="sub">Not at all likely</span><select id="wf-enps"><option value="">Rather not say</option>${Array.from({length: 11}, (_, i) => `<option value="${i}"${mine?.enps === i ? ' selected' : ''}>${i}</option>`).join('')}</select><span class="sub">Extremely likely</span>
      <span class="sub">· asked once a month</span></div></div>` : '<input type="hidden" id="wf-enps" value="">'}
    <div class="row"><button class="btn" type="submit">${mine ? 'Update check-in' : 'Send check-in'}</button></div></form>` : ''}
  ${team ? `<div class="stats">${stat('ros', 'Needs attention', need, need ? 'Heavy workload or a low score' : 'Nobody flagged this week', null, 'ci')}
    ${stat('tea', 'Checked in', rows.filter(r => r.w).length + '/' + rows.length, 'People who answered this week', null, 'ci')}
    ${stat('ind', 'Average workload', avg == null ? '—' : fmt(avg) + '/5', avg == null ? 'No check-ins yet' : WLOAD[Math.round(avg)], null, 'ci')}
    ${(x => stat('vio', 'eNPS', x ? (x.score > 0 ? '+' : '') + x.score : '—', x ? `${x.pro} promoters, ${x.det} detractors of ${x.n}` : 'Nobody has answered yet', null, 'ci'))(enpsScore(names))}</div>

    <div class="sub">${r.w ? esc(WLOAD[r.w.workload] + ' workload · feeling ' + MOOD[r.w.mood].toLowerCase()) : 'No check-in this week'}</div>

    <div class="acts">${r.w ? chip(r.w.workload + '/5 workload', r.w.workload >= 4 ? 'warn' : '') : chip('No check-in')}${r.flag ? chip('Needs attention', 'bad') : ''}</div></div>`).join('')}</div>`
    : empty('Nobody to show yet.')}</div>` : ''}`;
}

function viewCheck(e) {
  const pendN = (isGroup(e) || e.role === 'manager') ? leavePending(e).length : 0;
  const c = liveCycle(), mineRev = c ? revOf(c.id, e.name) : null;
  const revDue = c && !c.closed && e.role !== 'hr' && !(mineRev && mineRev.self) ? 1 : 0;
  const segs = [['week', 'This week', surveyDue(e) ? 1 : 0], ['rev', 'Review cycle', revDue], ['leave', 'Leave', pendN]];
  const body = ciSeg === 'rev' ? viewRev(e) : ciSeg === 'leave' ? viewLeave(e) : viewWelf(e);
  return `${pageHead('Check-ins', 'The weekly pulse, the formal review cycle and time off, in one place.')}
  <div class="seg" role="tablist" aria-label="Which check-in">${segs.map(([v, l, n]) => `<button role="tab" aria-selected="${ciSeg === v}" data-act="ciseg" data-v="${v}">${l}${n ? `<span class="seg-n">${n}</span>` : ''}</button>`).join('')}</div>
  ${body}`;
}

function render() {
  const root = $('#root');
  const keep = [...root.querySelectorAll('input[id]:not([type=file]),textarea[id],select[id]')].map(el => ({id: el.id, v: el.value}));
  const ae = document.activeElement, focus = ae && ae.id && root.contains(ae) ? {id: ae.id, s: ae.selectionStart, e: ae.selectionEnd} : null;
  root.innerHTML = build();
  keep.forEach(k => { const el = document.getElementById(k.id); if (el && el.value !== k.v && !/^(ok-owner|subsel|pf-sub|pf-team|pf-role|ff-.*|t[tod]-.*|ok-kt-.*|ed-kt-.*|cf-.*)$/.test(k.id)) { if (el.tagName === 'SELECT' && ![...el.options].some(o => o.value === k.v)) return; el.value = k.v; } });
  if (focus) { const el = document.getElementById(focus.id); if (el) { el.focus(); try { if (focus.s != null) el.setSelectionRange(focus.s, focus.e); } catch (_) {} } }
}

// ---------- events ----------
const root = $('#root');
root.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  
  const a = b.dataset.act, id = b.dataset.id, e = eff(), i = +b.dataset.i;
  if (a === 'tab') { tab = b.dataset.t; confirmDel = null; navOpen = false; editing = null; okrUpd = null; krOpen = null; dossier = null; imp = null; }
  else if (a === 'menu') navOpen = !navOpen;
  else if (a === 'closenav') navOpen = false;
  else if (a === 'wk') { const n = +b.dataset.n; if (n === 0) wk = curWeek(); else { const d = parseIso(wk); d.setDate(d.getDate() + 7 * n); wk = iso(d); } }
  else if (a === 'newokr') showForm = !showForm;
  else if (a === 'krdone') setKr(b.dataset.o, i, b.dataset.v === '1');
  else if (a === 'askdel') confirmDel = id;
  else if (a === 'cancel') confirmDel = null;
  else if (a === 'addkr') { if (draft.krs.length < 20) { draft.krs.push(''); draft.ms.push(null); draft.kt.push('binary'); draft.tg.push(''); draft.un.push(''); } }
  else if (a === 'rmkr') { if (draft.krs.length > 2) { draft.krs.splice(i, 1); draft.ms.splice(i, 1); draft.kt.splice(i, 1); draft.tg.splice(i, 1); draft.un.splice(i, 1); } }
  else if (a === 'delokr') { confirmDel = null; del('okrs', id); }
  else if (a === 'approve') approve(b.dataset.o, i, true);
  else if (a === 'sendback') approve(b.dataset.o, i, false);
  else if (a === 'delstand') del('stand', id);
  else if (a === 'delperson') { confirmDel = null; del('people', id); }
  else if (a === 'saveperson') upd('people', id, {mgr: val('pr-m-' + id) || null, email: val('pr-e-' + id).trim(), role: val('pr-r-' + id), sub: val('pr-s-' + id), team: val('pr-t-' + id).trim()}).then(ok => { if (ok) toast('Saved.'); });
  else if (a === 'signout') { histM = null; ciSeg = 'week'; krOpen = null; standWho = null; revWho = null; okrUpd = null; tdraft = null; imp = null; openRole = null; hireTab = 'open'; openRev = null; day = null; dossier = null; perfTab = 'all'; editing = null; okrTab = null; ff = FF0(); pf = {q: '', team: '', role: ''}; uid = null; viewAs = null; subFilter = ''; }
  else if (a === 'signin') { uid = id; viewAs = null; subFilter = ''; tab = 'dash'; }
  else if (a === 'subfilter') subFilter = b.dataset.s || '';
  else if (a === 'subappr') { subFilter = b.dataset.s; tab = 'appr'; }
  else if (a === 'editokr') { const o = S.okrs.find(x => x.id === id); if (o) editing = {id, obj: o.objective, krs: o.krs.map((k, j) => ({src: j, title: k.title, month: k.month, type: k.type || 'binary', target: k.target ?? '', unit: k.unit || ''}))}; }
