# nginx in front of the tracker, for HTTPS. Replace okr.example.com and the certificate paths.
# Certificates: certbot --nginx -d okr.example.com (or your company's own certificate).

server {
    listen 80;
    server_name okr.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name okr.example.com;

    ssl_certificate     /etc/letsencrypt/live/okr.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/okr.example.com/privkey.pem;

    client_max_body_size 128k;

    # The headers are repeated in each location: a location that sets any proxy_set_header drops the server-level ones.
    # $remote_addr, not $proxy_add_x_forwarded_for: the app trusts the first address for sign-in rate limits.

    # Live updates: a long-lived stream that must not be buffered.
    location = /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
